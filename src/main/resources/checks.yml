# ============================================================
# AegisGuard - Check Configuration
# Author: wyno
# ============================================================

# Each check has:
#   enabled: true/false
#   threshold: VL required to trigger action
#   cooldown: ms between flags
#   decay-rate: VL decay per interval
#   weight: multiplier for VL gain
#   setback: whether to setback players
#   punish: whether to auto-punish
#   verbose: enable debug output for this check

